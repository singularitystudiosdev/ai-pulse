name: feed
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}
concurrency:
  group: feed
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node src/run.mjs
        env: { TZ: 'UTC' }
      - name: Commit state + feed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/ docs/data/ archive/ README.md
          git diff --cached --quiet || git commit -m "feed: $(date -u +%F-%H:%M) [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && break || sleep $((i*10))
          done
      # Self-perpetuating 24/7 loop: each run queues the next, paced to >=5 min
      # by a runs-per-hour cap. GitHub's scheduler missed every cron slot since
      # registration (07:15-07:30 UTC) — this keeps the agent alive regardless.
      - name: Chain next run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          CUTOFF=$(date -u -d '1 hour ago' +%Y-%m-%dT%H:%M:%SZ)
          COUNT=$(gh api "repos/$REPO/actions/runs?per_page=100" \
            --jq '[.workflow_runs[] | select(.created_at > "'"$CUTOFF"'")] | length')
          echo "runs in last hour: $COUNT"
          if [ "$COUNT" -lt 10 ]; then
            gh api -X POST "repos/$REPO/actions/workflows/feed.yml/dispatches" -f ref=main
            echo "next run queued"
          else
            echo "hourly cap reached — cron and the chain's own pacing take over"
          fi
