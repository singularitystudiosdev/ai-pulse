name: feed
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}
concurrency:
  group: feed
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node src/run.mjs
        env: { TZ: 'UTC' }
      - name: Commit state + feed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/ docs/data/ archive/ README.md
          git diff --cached --quiet || git commit -m "feed: $(date -u +%F-%H:%M) [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && break || sleep $((i*10))
          done
